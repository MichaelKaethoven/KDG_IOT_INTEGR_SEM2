# fly.toml app configuration file generated for findmy-middleware-dappled-silence-7211 on 2026-05-19T13:50:41+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'findmy-middleware-dappled-silence-7211'
primary_region = 'ams'

[build]

[processes]
  middleware = 'gunicorn --chdir runtime --bind [::]:5500 --workers 1 --threads 4 middleware:app'
  subscriber = 'python runtime/subscriber.py'

[[mounts]]
  source = 'auth_data'
  destination = '/app/auth_data'
  processes = ['middleware']

# No public [[services]] block: the middleware exposes live geolocation and must
# not be internet-reachable. The webapp reaches it over Fly private networking
# (fly.webapp.toml MIDDLEWARE_URL = http://<app>.internal:5500), which works
# without a public service. Health is checked at the machine level below.
[checks]
  [checks.middleware_health]
    type = 'http'
    port = 5500
    interval = '1m0s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'
    processes = ['middleware']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
