apiVersion: 1

datasources:
  - name: Supabase
    uid: supabase-postgres
    type: postgres
    url: ${SUPABASE_DB_HOST}:5432
    user: ${SUPABASE_DB_USER}
    secureJsonData:
      password: ${SUPABASE_DB_PASSWORD}
    jsonData:
      database: postgres
      sslmode: require
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
    isDefault: true
    editable: false
