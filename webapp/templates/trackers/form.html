{% extends "base.html" %}
{% block title %}{% if tracker %}Edit Tracker{% else %}Add Tracker{% endif %}{% endblock %}
{% block content %}
<div class="mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('trackers.list_trackers') }}">Trackers</a></li>
      <li class="breadcrumb-item active">{% if tracker %}Edit{% else %}Add{% endif %}</li>
    </ol>
  </nav>
</div>

<div class="card shadow-sm" style="max-width:480px">
  <div class="card-body">
    <h5 class="card-title">{% if tracker %}Edit Tracker{% else %}Add Tracker{% endif %}</h5>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Device name <span class="text-danger">*</span></label>
        <input type="text" name="device_name" class="form-control font-monospace"
               value="{{ tracker.device_name if tracker else '' }}" required
               placeholder="Matches the name in device_locations">
      </div>
      <div class="mb-3">
        <label class="form-label">Serial number</label>
        <input type="text" name="serial_number" class="form-control"
               value="{{ tracker.serial_number if tracker else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2">{{ tracker.notes if tracker else '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark">Save</button>
        <a href="{{ url_for('trackers.list_trackers') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
