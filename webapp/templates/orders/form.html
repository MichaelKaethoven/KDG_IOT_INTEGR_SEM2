{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block content %}
<div class="mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('orders.list_orders') }}">Orders</a></li>
      <li class="breadcrumb-item active">New</li>
    </ol>
  </nav>
</div>

<div class="card shadow-sm" style="max-width:480px">
  <div class="card-body">
    <h5 class="card-title">New Order</h5>
    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Customer <span class="text-danger">*</span></label>
        <select name="customer_id" class="form-select" required>
          <option value="">Select customer…</option>
          {% for c in customers %}
            <option value="{{ c.id }}" {% if request.args.get('customer') == c.id %}selected{% endif %}>
              {{ c.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantity <span class="text-danger">*</span></label>
        <input type="number" name="quantity" class="form-control" min="1" value="1" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          {% for s in statuses %}
            <option value="{{ s }}" {% if s == 'pending' %}selected{% endif %}>{{ s | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark">Create order</button>
        <a href="{{ url_for('orders.list_orders') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
