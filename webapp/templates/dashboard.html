{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
  <h5 class="mb-0"><i class="bi bi-map"></i> Tracker Map</h5>

  <form class="d-flex gap-2 ms-auto flex-wrap align-items-center" method="get">

    <div class="btn-group btn-group-sm" role="group" aria-label="View mode">
      <input type="radio" class="btn-check" name="view" id="view-current"
             value="current" {% if selected_view == 'current' %}checked{% endif %}
             onchange="this.form.submit()">
      <label class="btn btn-outline-primary" for="view-current">
        <i class="bi bi-geo-alt-fill"></i> Current
      </label>

      <input type="radio" class="btn-check" name="view" id="view-historical"
             value="historical" {% if selected_view == 'historical' %}checked{% endif %}
             onchange="this.form.submit()">
      <label class="btn btn-outline-primary" for="view-historical">
        <i class="bi bi-clock-history"></i> Historical
      </label>
    </div>

    <div class="vr"></div>

    <select name="customer" class="form-select form-select-sm" style="width:auto"
            onchange="this.form.submit()">
      <option value="all" {% if selected_customer == 'all' %}selected{% endif %}>All customers</option>
      {% for c in customers %}
        <option value="{{ c.id }}" {% if selected_customer == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>

    <select name="order" class="form-select form-select-sm" style="width:auto"
            onchange="this.form.submit()">
      <option value="all" {% if selected_order == 'all' %}selected{% endif %}>All orders</option>
      {% for o in orders %}
        <option value="{{ o.id }}" {% if selected_order == o.id %}selected{% endif %}>
          Order {{ o.id[:8] }}… ({{ o.status }})
        </option>
      {% endfor %}
    </select>

    <select name="tracker" class="form-select form-select-sm" style="width:auto"
            onchange="this.form.submit()">
      <option value="all" {% if selected_tracker == 'all' %}selected{% endif %}>All trackers</option>
      {% for t in trackers %}
        <option value="{{ t.device_name }}"
                {% if selected_tracker == t.device_name %}selected{% endif %}>
          {{ t.device_name }}
        </option>
      {% endfor %}
    </select>

  </form>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    <iframe src="{{ iframe_src }}" width="100%" height="840" frameborder="0"
            style="border-radius:.375rem;display:block"></iframe>
  </div>
</div>

{% endblock %}
