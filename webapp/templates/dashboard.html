{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
  <h5 class="mb-0"><i class="bi bi-map"></i> Live Tracker Map</h5>

  <form class="d-flex gap-2 ms-auto flex-wrap" method="get">
    <select name="customer" class="form-select form-select-sm" style="width:auto" onchange="this.form.submit()">
      <option value="all" {% if selected_customer == 'all' %}selected{% endif %}>All customers</option>
      {% for c in customers %}
        <option value="{{ c.id }}" {% if selected_customer == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>

    <select name="order" class="form-select form-select-sm" style="width:auto" onchange="this.form.submit()">
      <option value="all" {% if selected_order == 'all' %}selected{% endif %}>All orders</option>
      {% for o in orders %}
        <option value="{{ o.id }}" {% if selected_order == o.id %}selected{% endif %}>
          Order {{ o.id[:8] }}… ({{ o.status }})
        </option>
      {% endfor %}
    </select>
  </form>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    <iframe src="{{ iframe_src }}" width="100%" height="720" frameborder="0"
            style="border-radius:.375rem;display:block"></iframe>
  </div>
</div>
{% endblock %}
