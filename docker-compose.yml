services:
  middleware:
    build: .
    # Bind to localhost only — the middleware exposes live geolocation and must
    # not be reachable from the LAN. The webapp reaches it over the compose
    # network as http://middleware:5500 regardless of this host mapping.
    ports:
      - "127.0.0.1:5500:5500"
    volumes:
      - ./libs/Auth:/app/libs/Auth
    environment:
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - LOCATION_BATCH_SIZE=${LOCATION_BATCH_SIZE:-8}
      - LOCATION_BATCH_DELAY=${LOCATION_BATCH_DELAY:-2.0}
      - PORT=5500
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC:-findmy/devices}
      - DEVICE_API_TOKEN=${DEVICE_API_TOKEN:-}
      # Read by the middleware to pick up live Settings-page changes from the
      # app_settings table. Optional — falls back to the env defaults above.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}

  subscriber:
    build: .
    command: python runtime/subscriber.py
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC:-findmy/devices}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 5s

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    ports:
      - "8080:8080"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - USER_PASSWORD_HASH=${USER_PASSWORD_HASH}
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}
      - GRAFANA_INTERNAL_URL=${GRAFANA_INTERNAL_URL:-http://grafana:3000}
      - MIDDLEWARE_URL=${MIDDLEWARE_URL:-http://middleware:5500}
      - DEVICE_API_TOKEN=${DEVICE_API_TOKEN:-}
    depends_on:
      - middleware

  grafana:
    image: grafana/grafana:11.0.0
    # Bind admin UI to localhost only. The webapp reaches Grafana over the
    # compose network at http://grafana:3000 via its login-gated /grafana proxy.
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Anonymous Viewer is safe here because Grafana is only reached through the
      # webapp's login-gated /grafana proxy (and localhost for admin).
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=${WEBAPP_PUBLIC_URL:-http://localhost:8080}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}

volumes:
  grafana_data:
